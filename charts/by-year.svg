  <g class="mark"><title>2024: 71 of 462 templates break (15.4%)</title><rect class="hit" x="490" y="90" width="72" height="200"/><path class="bar" fill="var(--s1)" d="M496,250 V223.26 Q496,219.26 500,219.26 H552 Q556,219.26 556,223.26 V250 Z"/><text x="526" y="213.26" class="val" text-anchor="middle">15.4%</text><text x="526" y="268" text-anchor="middle" fill="var(--ink)">2024</text><text x="526" y="284" class="muted" text-anchor="middle">n=462</text></g>
  <g class="mark"><title>2025: 622 of 6,561 templates break (9.5%)</title><rect class="hit" x="574" y="90" width="72" height="200"/><path class="bar" fill="var(--s1)" d="M580,250 V235.04 Q580,231.04 584,231.04 H636 Q640,231.04 640,235.04 V250 Z"/><text x="610" y="225.04" class="val" text-anchor="middle">9.5%</text><text x="610" y="268" text-anchor="middle" fill="var(--ink)">2025</text><text x="610" y="284" class="muted" text-anchor="middle">n=6,561</text></g>
  <g class="mark"><title>2026: 172 of 6,420 templates break (2.7%)</title><rect class="hit" x="658" y="90" width="72" height="200"/><path class="bar" fill="var(--s1)" d="M664,250 V248.64 Q664,244.64 668,244.64 H720 Q724,244.64 724,248.64 V250 Z"/><text x="694" y="238.64" class="val" text-anchor="middle">2.7%</text><text x="694" y="268" text-anchor="middle" fill="var(--ink)">2026</text><text x="694" y="284" class="muted" text-anchor="middle">n=6,420</text></g>
