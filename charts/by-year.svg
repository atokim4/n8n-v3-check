  <g class="mark"><title>2019: 15 of 24 templates break (62.5%)</title><rect class="hit" x="70" y="90" width="72" height="200"/><path class="bar" fill="var(--s1)" d="M76,250 V129 Q76,125 80,125 H132 Q136,125 136,129 V250 Z"/><text x="106" y="119" class="val" text-anchor="middle">62.5%</text><text x="106" y="268" text-anchor="middle" fill="var(--ink)">2019</text><text x="106" y="284" class="muted" text-anchor="middle">n=24</text></g>
  <g class="mark"><title>2020: 77 of 307 templates break (25.1%)</title><rect class="hit" x="154" y="90" width="72" height="200"/><path class="bar" fill="var(--s1)" d="M160,250 V203.84 Q160,199.84 164,199.84 H216 Q220,199.84 220,203.84 V250 Z"/><text x="190" y="193.84" class="val" text-anchor="middle">25.1%</text><text x="190" y="268" text-anchor="middle" fill="var(--ink)">2020</text><text x="190" y="284" class="muted" text-anchor="middle">n=307</text></g>
